name: Build wheels

on:
  push:
    branches:
    - master
    tags:
    - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CIBW_ENABLE: pypy
  CIBW_TEST_REQUIRES: pytest
  CIBW_TEST_COMMAND: pytest {project}/tests -q -p no:cacheprovider
  CIBW_BUILD_VERBOSITY: 1

jobs:
  build_wheels:
    name: Wheels for ${{ matrix.archs }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          archs: x86_64 i686
        - os: ubuntu-24.04-arm
          archs: aarch64 armv7l
        - os: ubuntu-latest
          archs: ppc64le
          qemu: true
        - os: ubuntu-latest
          archs: s390x
          qemu: true
        - os: ubuntu-latest
          archs: riscv64
          qemu: true
        - os: macos-latest
          archs: x86_64 arm64
        - os: windows-latest
          archs: AMD64 x86
        - os: windows-11-arm
          archs: ARM64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: all

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.3.5

      - name: Build wheels
        run: python -m cibuildwheel --output-dir dist
        env:
          CIBW_ARCHS: ${{ matrix.archs }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: dist/*.whl

  build_source:
    name: Source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Build source distribution
        run: pipx run build --sdist --outdir dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  # The PyPI name belongs to upstream, so a tag publishes a GitHub release instead.
  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build_wheels, build_source]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
